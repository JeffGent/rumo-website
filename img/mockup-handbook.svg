<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" fill="none">
  <defs>
    <style>
      .heading { font-family: Georgia, 'Times New Roman', serif; }
      .ui { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <clipPath id="round"><rect width="680" height="480" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
