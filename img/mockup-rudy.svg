<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" fill="none">
  <defs>
    <style>
      .heading { font-family: Georgia, 'Times New Roman', serif; }
      .ui { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <clipPath id="round"><rect width="480" height="520" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="480" height="520" fill="#faf7f2"/>

    <!-- Header -->
    <rect width="480" height="68" fill="#2c2418" rx="16"/>
    <rect y="16" width="480" height="52" fill="#2c2418"/>

    <!-- Rudy avatar -->
    <circle cx="48" cy="36" r="20" fill="#c4653a"/>
    <text x="48" y="42" class="heading" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">R</text>

    <text x="80" y="30" class="heading" fill="#faf7f2" font-size="15" font-weight="700">Rudy</text>
    <text x="80" y="48" class="ui" fill="#faf7f2" font-size="11" opacity="0.45">AI-assistent  &#xb7;  Online</text>
    <circle cx="74" cy="44" r="4" fill="#6b8f71"/>

    <!-- Chat area -->
    <!-- Bot message 1 -->
    <rect x="24" y="88" width="320" height="64" rx="14" fill="#fff"/>
    <text x="40" y="106" class="ui" fill="#c4653a" font-size="10" font-weight="700">Rudy</text>
    <text x="40" y="124" class="ui" fill="#2c2418" font-size="13">Hoi! Ik ben Rudy, de AI-assistent van</text>
    <text x="40" y="142" class="ui" fill="#2c2418" font-size="13">Rumo. Hoe kan ik je helpen?</text>

    <!-- User message 1 -->
    <rect x="180" y="172" width="276" height="40" rx="14" fill="#c4653a"/>
    <text x="200" y="197" class="ui" fill="#fff" font-size="13">Welke kamers zijn morgen vrij?</text>

    <!-- Bot message 2 (the answer) -->
    <rect x="24" y="232" width="380" height="180" rx="14" fill="#fff"/>
    <text x="40" y="252" class="ui" fill="#c4653a" font-size="10" font-weight="700">Rudy</text>
    <text x="40" y="272" class="ui" fill="#2c2418" font-size="13">Morgen (16 april) zijn er 6 kamers vrij:</text>

    <!-- Room list -->
    <rect x="40" y="286" width="340" height="30" rx="6" fill="#faf7f2"/>
    <text x="56" y="305" class="ui" fill="#2c2418" font-size="12" font-weight="600">103</text>
    <text x="96" y="305" class="ui" fill="#2c2418" font-size="12" opacity="0.5">Double  &#xb7;  Zeezicht</text>
    <rect x="310" y="292" width="56" height="20" rx="6" fill="#6b8f71" opacity="0.12"/>
    <text x="320" y="306" class="ui" fill="#6b8f71" font-size="10" font-weight="600">Clean</text>

    <rect x="40" y="320" width="340" height="30" rx="6" fill="#faf7f2"/>
    <text x="56" y="339" class="ui" fill="#2c2418" font-size="12" font-weight="600">107</text>
    <text x="96" y="339" class="ui" fill="#2c2418" font-size="12" opacity="0.5">Twin  &#xb7;  Tuinzicht</text>
    <rect x="310" y="326" width="56" height="20" rx="6" fill="#6b8f71" opacity="0.12"/>
    <text x="320" y="340" class="ui" fill="#6b8f71" font-size="10" font-weight="600">Clean</text>

    <rect x="40" y="354" width="340" height="30" rx="6" fill="#faf7f2"/>
    <text x="56" y="373" class="ui" fill="#2c2418" font-size="12" font-weight="600">205</text>
    <text x="96" y="373" class="ui" fill="#2c2418" font-size="12" opacity="0.5">Suite  &#xb7;  Zeezicht</text>
    <rect x="310" y="360" width="56" height="20" rx="6" fill="#c4653a" opacity="0.1"/>
    <text x="322" y="374" class="ui" fill="#c4653a" font-size="10" font-weight="600">Dirty</text>

    <text x="40" y="402" class="ui" fill="#2c2418" font-size="12" opacity="0.4">+ 3 meer kamers beschikbaar</text>

    <!-- User message 2 -->
    <rect x="120" y="428" width="336" height="40" rx="14" fill="#c4653a"/>
    <text x="140" y="453" class="ui" fill="#fff" font-size="13">Boek 103 voor Van Damme, 2 nachten</text>

    <!-- Typing indicator -->
    <rect x="24" y="484" width="80" height="28" rx="14" fill="#fff"/>
    <circle cx="46" cy="498" r="4" fill="#2c2418" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="498" r="4" fill="#2c2418" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="498" r="4" fill="#2c2418" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>