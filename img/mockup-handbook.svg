    <svg x="216" y="164" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b8f71" stroke-width="1.8">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
