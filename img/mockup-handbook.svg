    <rect x="354" y="256" width="148" height="100" rx="12" fill="#fff" stroke="#e8e4df"/>
    <rect x="372" y="274" width="34" height="34" rx="8" fill="#d4a574" opacity="0.2"/>
    <text x="380" y="296" class="ui" fill="#d4a574" font-size="16">&#x2665;</text>
    <circle cx="497" cy="264" r="5" fill="#c4653a"/>
