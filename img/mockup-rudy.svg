<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" fill="none">
  <defs>
    <style>
      .u { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h { font-family: Georgia, 'Times New Roman', serif; }
    </style>
    <clipPath id="r"><rect width="420" height="480" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="420" height="480" fill="#faf7f2"/>

    <!-- Header -->
    <rect width="420" height="60" fill="#2c2418" rx="16" opacity="0.9"/>
    <rect y="16" width="420" height="44" fill="#2c2418" opacity="0.9"/>

    <!-- Avatar -->
    <circle cx="40" cy="32" r="16" fill="#d4a574" opacity="0.7"/>
    <text x="40" y="37" class="h" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">R</text>

    <rect x="66" y="22" width="36" height="10" rx="3" fill="#faf7f2" opacity="0.6"/>
    <rect x="66" y="38" width="72" height="6" rx="2" fill="#faf7f2" opacity="0.2"/>
    <circle cx="62" cy="40" r="3" fill="#6b8f71" opacity="0.5"/>

    <!-- Bot message 1 -->
    <rect x="20" y="80" width="260" height="50" rx="12" fill="#fff"/>
    <rect x="34" y="94" width="28" height="6" rx="2" fill="#d4a574" opacity="0.35"/>
    <rect x="34" y="108" width="200" height="6" rx="2" fill="#2c2418" opacity="0.15"/>
    <rect x="34" y="120" width="140" height="6" rx="2" fill="#2c2418" opacity="0.1"/>

    <!-- User message 1 -->
    <rect x="140" y="148" width="260" height="36" rx="12" fill="#d4a574" opacity="0.6"/>
    <rect x="160" y="163" width="160" height="6" rx="2" fill="#fff" opacity="0.55"/>

    <!-- Bot message 2 (answer with rooms) -->
    <rect x="20" y="202" width="320" height="160" rx="12" fill="#fff"/>
    <rect x="34" y="216" width="28" height="6" rx="2" fill="#d4a574" opacity="0.35"/>
    <rect x="34" y="232" width="200" height="6" rx="2" fill="#2c2418" opacity="0.15"/>

    <!-- Room rows -->
    <rect x="34" y="250" width="280" height="26" rx="5" fill="#faf7f2"/>
    <rect x="46" y="259" width="20" height="8" rx="2" fill="#2c2418" opacity="0.3"/>
    <rect x="76" y="260" width="100" height="6" rx="2" fill="#2c2418" opacity="0.1"/>
    <rect x="264" y="256" width="40" height="14" rx="4" fill="#6b8f71" opacity="0.1"/>
    <rect x="272" y="260" width="24" height="6" rx="2" fill="#6b8f71" opacity="0.25"/>

    <rect x="34" y="282" width="280" height="26" rx="5" fill="#faf7f2"/>
    <rect x="46" y="291" width="20" height="8" rx="2" fill="#2c2418" opacity="0.3"/>
    <rect x="76" y="292" width="90" height="6" rx="2" fill="#2c2418" opacity="0.1"/>
    <rect x="264" y="288" width="40" height="14" rx="4" fill="#6b8f71" opacity="0.1"/>
    <rect x="272" y="292" width="24" height="6" rx="2" fill="#6b8f71" opacity="0.25"/>

    <rect x="34" y="314" width="280" height="26" rx="5" fill="#faf7f2"/>
    <rect x="46" y="323" width="20" height="8" rx="2" fill="#2c2418" opacity="0.3"/>
    <rect x="76" y="324" width="80" height="6" rx="2" fill="#2c2418" opacity="0.1"/>
    <rect x="264" y="320" width="40" height="14" rx="4" fill="#d4a574" opacity="0.08"/>
    <rect x="274" y="324" width="22" height="6" rx="2" fill="#d4a574" opacity="0.25"/>

    <rect x="34" y="348" width="120" height="6" rx="2" fill="#2c2418" opacity="0.08"/>

    <!-- User message 2 -->
    <rect x="100" y="380" width="300" height="36" rx="12" fill="#d4a574" opacity="0.6"/>
    <rect x="120" y="395" width="200" height="6" rx="2" fill="#fff" opacity="0.55"/>

    <!-- Typing indicator -->
    <rect x="20" y="434" width="70" height="28" rx="14" fill="#fff"/>
    <circle cx="40" cy="448" r="4" fill="#2c2418" opacity="0.12">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="448" r="4" fill="#2c2418" opacity="0.12">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="68" cy="448" r="4" fill="#2c2418" opacity="0.12">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>